global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'learning-backend'
    static_configs:
      - targets: ['server:5000']

  - job_name: 'host-metrics'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'container-metrics'
    static_configs:
      - targets: ['cadvisor:8080']
