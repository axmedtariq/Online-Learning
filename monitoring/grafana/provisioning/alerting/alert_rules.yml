apiVersion: 1

groups:
  - name: App Health Alerts
    folder: "Cockpit Alerts"
    interval: 1m
    rules:
      - uid: backend-5xx-spike
        title: "🚨 BACKEND ENGINE FAILURE: 5xx Spikes"
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: "sum(irate(istio_requests_total{response_code=~\"5.*\"}[5m])) > 5"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Backend is returning high rates of 5xx errors."
          description: "ISTIO detected that the backend service is struggling. Check logs immediately."
        labels:
          severity: critical
          service_name: backend

      - uid: high-cpu-alert
        title: "🔥 ENGINE OVERHEATING: High CPU Usage"
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: "100 - (avg(irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100) > 85"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "System CPU is above 85%"
          description: "The host machine is under heavy load. The cockpit is at risk."
        labels:
          severity: warning
