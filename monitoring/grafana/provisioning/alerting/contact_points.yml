apiVersion: 1

contactPoints:
  - name: Slack Alerts
    receivers:
      - uid: slack-receiver
        type: slack
        settings:
          url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
          recipient: "#monitoring-alerts"
          username: "Grafana Cockpit Bot"
          title: '{{ template "slack.default.title" . }}'
          text: '{{ template "slack.default.text" . }}'

policies:
  - orgId: 1
    receiver: Slack Alerts
    group_by: ['alertname', 'grafana_folder', 'service_name']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
