version: '3.8'

services:
  # --- CORE INFRASTRUCTURE ---
  vault:
    image: hashicorp/vault:latest
    container_name: vault_container
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=hvs.your_vault_token_here
    cap_add:
      - IPC_LOCK
    restart: always

  # --- MICROSERVICES (SUPABASE BACKED) ---
  auth-service:
    build: ./microservices/auth-service
    container_name: auth_service_container
    ports:
      - "5001:5001"
    env_file: .env
    depends_on:
      - vault
    restart: on-failure

  curriculum-service:
    build: ./microservices/curriculum-service
    container_name: curriculum_service_container
    ports:
      - "5002:5002"
    env_file: .env
    depends_on:
      - vault
    restart: on-failure

  transaction-service:
    build: ./microservices/transaction-service
    container_name: transaction_service_container
    ports:
      - "5003:5003"
    env_file: .env
    depends_on:
      - vault
    restart: on-failure

  # --- MONITORING (PROMETHEUS & GRAFANA) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_ms
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_ms
    ports:
      - "3100:3000"
    depends_on:
      - prometheus
    restart: always

  # --- FRONTEND ---
  client:
    build: ./client
    container_name: client_ms
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001/api # Points to Auth/Gateway
    depends_on:
      - auth-service
    stdin_open: true
    tty: true
    restart: always
