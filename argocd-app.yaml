apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elearn-mern-stack
  namespace: argocd
spec:
  project: default
  source:
    # Replace with your actual GitHub link!
    repoURL: 'https://github.com/YOUR_USERNAME/YOUR_REPO_NAME.git'
    targetRevision: HEAD
    path: 'helm-chart' 
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true